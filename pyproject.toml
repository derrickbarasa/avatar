[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "avatar-studio"
version = "0.3.0"
description = "A procedural 3D avatar creator with talking, animation and export"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pygame>=2.5", "PyOpenGL>=3.1", "numpy>=1.24"]

[project.optional-dependencies]
extras = ["opencv-python-headless<5", "imageio-ffmpeg", "sounddevice", "pyvirtualcam"]

[project.scripts]
avatar-studio = "avatarkit.app:main"

[tool.setuptools]
packages = ["avatarkit"]
